<!-- Modal para Certificaciones -->
    <div class="cert-modal" id="certModal" role="dialog" aria-labelledby="certModalTitle" aria-hidden="true">
        <div class="cert-modal-overlay" id="certModalOverlay"></div>
        <div class="cert-modal-content">
            <button class="cert-modal-close" id="certModalClose" aria-label="Cerrar modal">
                <i class="fas fa-times"></i>
            </button>
            <div class="cert-modal-body">
                <h3 id="certModalTitle">Certificación</h3>
                <div class="cert-image-container">
                    <img id="certImage" src="" alt="Certificación" loading="lazy">
                </div>
                <div class="cert-modal-info">
                    <p id="certDescription"></p>
                    <p class="cert-date" id="certDate"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- boton volver arriba -->
    <button class="back-to-top" id="backToTop" aria-label="Volver arriba">
        <i class="fas fa-arrow-up"></i>
    </button>
